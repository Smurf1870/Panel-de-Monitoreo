services:
  panel:
    build: .
    container_name: gp-monitoreo
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
