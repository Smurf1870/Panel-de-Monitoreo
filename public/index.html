<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Grupo Presidente - Monitoreo de Redes</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/assets/favicon.svg" alt="" width="44" height="44" />
        <div class="brand-text">
          <span class="brand-company" id="brand-company">Grupo Presidente</span>
          <h1 id="brand-title">Monitoreo de Redes</h1>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="conn" id="conn" data-state="loading" title="Estado de la conexión con Uptime Kuma">
          <span class="conn-dot" aria-hidden="true"></span>
          <span class="conn-text" id="conn-text">Conectando…</span>
        </div>
        <button class="btn ghost" id="refresh" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <path
              d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Actualizar
        </button>
      </div>
    </header>

    <main class="page">
      <section class="toolbar" aria-label="Resumen y búsqueda">
        <div class="summary" id="summary"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="Buscar por nombre, tag, host o URL…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
      </section>

      <div class="banner hidden" id="banner" role="status"></div>

      <section class="incidents hidden" id="incidents" aria-label="Incidentes"></section>

      <section class="monitors-section" aria-label="Monitores">
        <div class="section-head">
          <h2>Monitores</h2>
          <span class="section-count" id="visible-count"></span>
        </div>
        <div class="grid" id="monitors"></div>
        <p class="empty hidden" id="empty">No hay monitores que coincidan con la búsqueda.</p>
      </section>

      <footer class="footer">
        <span id="footer-company">Grupo Presidente</span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <span id="footer-updated">Esperando datos…</span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <span>Datos de Uptime Kuma</span>
      </footer>
    </main>

    <dialog class="dialog" id="history-dialog">
      <div class="dialog-head">
        <div class="dialog-title-wrap">
          <h2 id="dialog-title">Historial</h2>
          <p class="dialog-sub" id="dialog-sub"></p>
        </div>
        <button class="btn icon" id="dialog-close" type="button" aria-label="Cerrar historial">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
            <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <div class="tabs" role="tablist" aria-label="Tipo de historial">
        <button class="tab is-active" type="button" role="tab" data-tab="events" aria-selected="true">
          Eventos
        </button>
        <button class="tab" type="button" role="tab" data-tab="heartbeats" aria-selected="false">
          Últimos pulsos
        </button>
      </div>

      <div class="dialog-body" id="dialog-body">
        <p class="muted">Cargando…</p>
      </div>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
